<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sondra AD — Automatischer Downloader</title>
    <meta
      name="description"
      content="Automatischer Hintergrund-Downloader für Ihre Sondra-Merkliste mit Google Drive, Speicherverwaltung und Archiv."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f8faf8" />
    <link rel="stylesheet" href="./fonts.css" />
    <link rel="preload" href="./fonts/public-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/courier-prime-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/cormorant-garamond-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
  </head>
  <body>
    <script>
      ;(function () {
        try {
          var choice = localStorage.getItem('sondra:theme')
          if (choice === 'light' || choice === 'dark') {
            document.documentElement.setAttribute('data-theme', choice)
          }
          var dark =
            choice === 'dark' ||
            (choice !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', dark ? '#0a110d' : '#f8faf8')
        } catch (error) {}
      })()
    </script>
    <div id="root"></div>
    <noscript>Sondra AD benötigt JavaScript zur Darstellung der Oberfläche.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
